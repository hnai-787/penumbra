name: fwlint
slug: fwlint

category: cybersecurity
subcategory: "Programming Fundamentals coursework"

status: completed

visibility: public

description:
  short: "fwlint: an offline C++ static analyzer that finds shadowed, redundant, correlated, and generalized rules in real Cisco ACL / JSON firewall policies, with witness packets and SARIF output."
  long: |
    Started as a Programming Fundamentals course project (Air University,
    Semester 1, Fall 2023) -- a rule-based firewall packet simulator -- and
    was rebuilt into fwlint, a firewall ruleset anomaly analyzer. Parses a
    real (bounded-subset) Cisco IOS extended ACL or a canonical JSON policy
    into an exact 5-tuple packet-space representation (axis-aligned box
    decomposition -- a published alternative to BDD-based analysis), then
    detects the four canonical Al-Shaer/Hamed anomaly types (shadowing,
    redundancy, correlation, generalization) including whole-policy
    "collective shadowing" where several earlier rules jointly make a later
    rule unreachable even though no single one does alone. Every finding
    includes a concrete witness packet. Outputs human-readable text,
    structured JSON, or SARIF 2.1.0 (for CI/GitHub code-scanning
    integration). The original coursework program is preserved unmodified
    under archive/academic-original/.

