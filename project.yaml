description:
  short: "A C++ rule-based firewall simulator that evaluates network packets against an ordered allow/deny rule set."
  long: |
    Reads an ordered list of firewall rules (source/destination IP or last-octet
    range, protocol, ALLOW/DENY) from a text file, then evaluates a set of
    sample packets against them top-down with a default-deny fallback,
    writing each decision to an output file. Built as a Programming
    Fundamentals course project (Air University, Semester 1, Fall 2023) to
    demonstrate ordered rule evaluation, string parsing, and basic input
    validation in C++.

